# /etc/ryzenadj-ppd.conf
#
# Overrides for ryzenadj-ppd. This file is sourced by bash,
# so it must remain valid bash syntax.
#
# Tuned for ThinkPad T14s Gen 2a (Ryzen 7 5850U).
# Adjust freely — these are just sane defaults.

# Power-saver: quiet, cool, for battery
POWER_SAVER_ARGS="--stapm-limit=15000 --fast-limit=20000 --slow-limit=15000 --tctl-temp=80"

# Balanced: mobile / undocked
BALANCED_ARGS="--stapm-limit=25000 --fast-limit=30000 --slow-limit=25000 --tctl-temp=85"

# Performance: docked, better airflow
PERFORMANCE_ARGS="--stapm-limit=30000 --fast-limit=35000 --slow-limit=30000 --tctl-temp=90"
