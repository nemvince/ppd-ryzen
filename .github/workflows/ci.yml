name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mise (and tools from mise.toml)
        uses: jdx/mise-action@v5
        with:
          install: true
          cache: true

      - name: shellcheck + shfmt
        run: mise run lint

  test:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mise (and tools from mise.toml)
        uses: jdx/mise-action@v5
        with:
          install: true
          cache: true

      - name: Run smoke tests
        run: mise run test

  package:
    name: Build tarball
    runs-on: ubuntu-latest
    needs: [ lint, test ]
    steps:
      - uses: actions/checkout@v7

      - name: Install mise (and tools from mise.toml)
        uses: jdx/mise-action@v5
        with:
          install: true
          cache: true

      - name: Build
        run: mise run package

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: |
            dist/*.tar.gz
            dist/*.sha256
